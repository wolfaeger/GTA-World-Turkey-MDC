name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Build and upload the installer for this existing tag (for example v1.0.0)"
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Take the version from the tag
        shell: bash
        run: |
          VER="${RELEASE_TAG#v}"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Tag '$RELEASE_TAG' is not a version tag like v1.2.3"
            exit 1
          fi
          npm version "$VER" --no-git-tag-version --allow-same-version
          sed -i "s/^#define AppVersion .*/#define AppVersion \"$VER\"/" installer/mdc-client.iss
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run smoke

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Check the installer name
        shell: bash
        run: |
          ls dist/*.exe
          test -f "dist/Mobile-Data-Computer-GTA-World-TR-Setup-${APP_VERSION}.exe"

      - name: Write release notes from CHANGELOG
        shell: bash
        run: node tools/release-notes.js "$APP_VERSION" release-notes.md

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: dist/*.exe
          overwrite_files: true
